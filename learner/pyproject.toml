[project]
name = "cdna-learner"
version = "0.1.0"
description = "C-DNA local, provenance-aware preference learner"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=2.3,<3", "scipy>=1.17,<2", "polars==1.44.2",
  "scikit-learn==1.9.1", "lightgbm==4.7.0", "pydantic>=2.13,<3",
  "jsonschema>=4.26,<5"
]
[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.12"]
bundle = ["pyinstaller>=6.16"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/cdna_learner"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
