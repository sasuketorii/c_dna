[project]
name = "cdna-learner"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["scikit-learn==1.9.1", "pydantic==2.13.5", "lightgbm==4.7.0", "scipy==1.18.1"]
[project.scripts]
cdna-learner = "cdna_learner.worker:main"
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py314"
line-length = 100
