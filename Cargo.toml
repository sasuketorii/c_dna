[workspace]
resolver = "2"
members = ["crates/cdna-core", "crates/cdna-mcp", "apps/desktop/src-tauri"]
default-members = ["crates/cdna-core", "crates/cdna-mcp"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
