[package]
name = "cdna-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
cdna-domain = { path = "../cdna-domain" }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["serde"] }
[dev-dependencies]
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "transport-async-rw"] }
