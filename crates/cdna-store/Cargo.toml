[package]
name = "cdna-store"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
thiserror = "2"

tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
