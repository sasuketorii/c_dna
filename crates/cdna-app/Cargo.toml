[package]
name = "cdna-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cdna"
path = "src/main.rs"

[dependencies]
cdna-evolution = { path = "../cdna-evolution" }
ed25519-dalek = "3"
cdna-domain = { path = "../cdna-domain" }
cdna-store = { path = "../cdna-store" }
cdna-inference = { path = "../cdna-inference" }
cdna-mcp = { path = "../cdna-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs", "limit"] }
rand = "0.10"
sha2 = "0.10"
rustix = { version = "1", features = ["process"] }
rpassword = "7.5.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

tempfile = "3"

[dev-dependencies]
# Exercise the existing official MCP transport against the real Engine in integration tests.
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "transport-async-rw"] }
